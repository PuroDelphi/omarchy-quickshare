[package]
name = "rqs_lib"
version = "0.11.5"
edition = "2021"
authors = ["martichou"]
license = "GPL-3.0-only"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "rfcomm", "l2cap"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
directories = "6.0"
futures = "0.3"
if-addrs = "0.10"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
libaes = "0.7"
log = "0.4"
mdns-sd = { path = "../../mdns-sd" }
mime_guess = "2.0"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
parking_lot = "0.12"
prost = "0.13"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.15", features = ["v4"] }
libc = "0.2"
subtle = "2.6"

[build-dependencies]
prost-build = "0.13"


