[package]
name = "omarchy-quickshare"
version = "0.3.6"
edition = "2021"
license = "MIT"
description = "Quick Share service and Omarchy shell integration"
authors = ["Jhonny Suarez - PuroDelphi"]
repository = "https://github.com/PuroDelphi/omarchy-quickshare"

[workspace]
members = ["vendor/rquickshare/core_lib", "vendor/mdns-sd"]
resolver = "2"

[dependencies]
anyhow = "1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "file_chooser"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
libc = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rqs_lib = { path = "vendor/rquickshare/core_lib" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
